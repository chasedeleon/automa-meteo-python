# Archivio automatico della chat del progetto: ogni commento scritto in una Pull Request o in una Issue
# viene aggiunto a storia/chat.md con un commit. Così la conversazione tra ragazzo, prof e Claude è versionata.
name: Archivio della chat

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write

concurrency:
  group: archivio-chat
  cancel-in-progress: false

jobs:
  archivia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Aggiunge il commento a storia/chat.md
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          c, issue = ev["comment"], ev["issue"]
          quando = datetime.fromisoformat(c["created_at"].replace("Z", "+00:00")).astimezone(ZoneInfo("Europe/Rome"))
          chi = c["user"]["login"]
          if "Generated by [Claude Code]" in c["body"]:
              chi = "Claude (dall'account " + chi + ")"
          testo = c["body"].replace("\r\n", "\n").strip()
          modifica = " (modificato)" if ev.get("action") == "edited" else ""
          # il messaggio si prepara a parte: si aggiunge al file solo subito prima del commit
          with open("/tmp/voce.md", "w", encoding="utf-8") as f:
              f.write(f"\n## {quando:%d/%m/%Y %H:%M} · {chi}{modifica} · #{issue['number']} {issue['title']}\n\n{testo}\n")
          PY
      - name: Salva con un commit
        run: |
          git config user.name "archivio-chat"
          git config user.email "archivio-chat@users.noreply.github.com"
          RAMO="${{ github.event.repository.default_branch }}"
          # se intanto è arrivato un altro messaggio, si riparte dall'ultima versione e si aggiunge in fondo: niente conflitti
          for i in 1 2 3 4 5; do
            git fetch -q origin "$RAMO" && git reset -q --hard "origin/$RAMO"
            mkdir -p storia
            [ -f storia/chat.md ] || printf '# La chat del progetto\n\nOgni messaggio scritto su GitHub (Pull Request e Issue), in ordine di arrivo. Si aggiunge da solo.\n' > storia/chat.md
            cat /tmp/voce.md >> storia/chat.md
            git add storia/chat.md
            git commit -q -m "Chat: messaggio di ${{ github.event.comment.user.login }}"
            git push -q origin "HEAD:$RAMO" && exit 0
            sleep $((i * 3))
          done
          exit 1
